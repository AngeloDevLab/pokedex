<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | Learnset</title>

    <link rel="icon" href="../assets/images/pokeball.png">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/standard.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/inputs.css">
    <link rel="stylesheet" href="../css/components/learnset.css">
    <link rel="stylesheet" href="../css/components/nav.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <script type="module" src="../js/learnset-page.js"></script>

</head>

<body>

    <header>
        <div class="header-content max-content">
            <div class="header-left">
                <div class="header-brand">
                    <a href="../index.html">
                        <img src="../assets/images/pokeball.png" alt="Pokeball Image">
                        <p>Pokédex</p>
                    </a>
                </div>
            </div>

            <div class="header-right">
                <div id="header-lang-slot" class="nav-desktop-only"></div>

                <div id="header-nav-slot" class="nav-desktop-only"></div>

                <button id="nav-toggle" class="svg-button nav-mobile-trigger">

                    <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 5h16" />
                        <path d="M4 12h16" />
                        <path d="M4 19h16" />
                    </svg>

                    <svg id="menu-close-icon" xmlns="http://www.w3.org/2000/svg" class="hidden" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>

                </button>
            </div>
        </div>
    </header>

    <div class="sidebar" id="sidebar"></div>

    <main>

        <div id="loader" class="loader hidden">
            <img src="../assets/images/pokeball.png" alt="Loading">
        </div>

        <div class="learnset-content max-content">

            <h1 data-i18n="learnset.title">Learnset</h1>

            <div class="search-group">
                <label for="pokemon-picker" data-i18n="common.pickerLabel">Choose a Pokémon</label>
                <input type="text" id="pokemon-picker" list="pokemon-options"
                    data-i18n-placeholder="common.pickerPlaceholder" placeholder="Enter name...">
                <datalist id="pokemon-options"></datalist>
            </div>

            <div id="learnset-result" class="learnset-result hidden">
                <h2 id="learnset-pokemon-name"></h2>

                <div class="legend">
                    <span class="legend-item">
                        <span class="move-category-badge move-category-physical"></span>
                        <span data-i18n="learnset.physical">Physical</span>
                    </span>
                    <span class="legend-item">
                        <span class="move-category-badge move-category-special"></span>
                        <span data-i18n="learnset.special">Special</span>
                    </span>
                    <span class="legend-item">
                        <span class="move-category-badge move-category-status"></span>
                        <span data-i18n="learnset.status">Status</span>
                    </span>
                </div>

                <section class="learnset-group" id="learnset-group-level-up">
                    <h3 data-i18n="learnset.levelUp">Level-up</h3>
                    <ul class="learnset-list" id="learnset-list-level-up"></ul>
                </section>

                <section class="learnset-group" id="learnset-group-machine">
                    <h3 data-i18n="learnset.tm">TM</h3>
                    <ul class="learnset-list" id="learnset-list-machine"></ul>
                </section>

                <section class="learnset-group" id="learnset-group-egg">
                    <h3 data-i18n="learnset.egg">Egg Moves</h3>
                    <ul class="learnset-list" id="learnset-list-egg"></ul>
                </section>

                <section class="learnset-group" id="learnset-group-tutor">
                    <h3 data-i18n="learnset.tutor">Tutor</h3>
                    <ul class="learnset-list" id="learnset-list-tutor"></ul>
                </section>
            </div>

        </div>

    </main>

    <footer>
        <div class="footer-content max-content">
            <img src="../assets/images/pokeball.png" alt="Pokeball Image">
            <a href="imprint.html" data-i18n="footer.imprint">Imprint</a>
        </div>
    </footer>

</body>

</html>
