<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | Moves</title>

    <link rel="icon" href="../assets/images/pokeball.png">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/standard.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/inputs.css">
    <link rel="stylesheet" href="../css/components/learnset.css">
    <link rel="stylesheet" href="../css/components/moves.css">
    <link rel="stylesheet" href="../css/components/nav.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <script type="module" src="../js/pages/moves-page.js"></script>

</head>

<body>

    <header>
        <div class="header-content max-content">
            <div class="header-left">
                <div class="header-brand">
                    <a href="../index.html">
                        <img src="../assets/images/pokeball.png" alt="Pokeball Image">
                        <p>Pokédex</p>
                    </a>
                </div>
            </div>

            <div class="header-right">
                <div id="header-lang-slot" class="nav-desktop-only"></div>

                <div id="header-nav-slot" class="nav-desktop-only"></div>

                <button id="nav-toggle" class="svg-button nav-mobile-trigger">

                    <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 5h16" />
                        <path d="M4 12h16" />
                        <path d="M4 19h16" />
                    </svg>

                    <svg id="menu-close-icon" xmlns="http://www.w3.org/2000/svg" class="hidden" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>

                </button>
            </div>
        </div>
    </header>

    <div class="sidebar" id="sidebar"></div>

    <main>

        <div id="loader" class="loader hidden">
            <img src="../assets/images/pokeball.png" alt="Loading">
        </div>

        <div class="moves-content max-content">

            <h1 data-i18n="moves.title">Moves</h1>

            <div class="search-group">
                <label for="move-search" data-i18n="moves.searchLabel">Search by Name</label>
                <input type="search" id="move-search" data-i18n-placeholder="moves.searchPlaceholder"
                    placeholder="Enter move name...">
            </div>

            <div class="search-group">
                <label for="move-type-filter" data-i18n="searchPanel.typeLabel">Filter by Type</label>
                <input list="move-type-list" id="move-type-filter" data-i18n-placeholder="searchPanel.typePlaceholder"
                    placeholder="Select type...">
                <datalist id="move-type-list">
                    <option value="fire">
                    <option value="water">
                    <option value="grass">
                    <option value="electric">
                    <option value="ice">
                    <option value="fighting">
                    <option value="poison">
                    <option value="ground">
                    <option value="flying">
                    <option value="psychic">
                    <option value="bug">
                    <option value="rock">
                    <option value="ghost">
                    <option value="dragon">
                    <option value="dark">
                    <option value="steel">
                    <option value="fairy">
                    <option value="normal">
                </datalist>
            </div>

            <div class="search-group">
                <label for="move-category-select" data-i18n="learnset.category">Category</label>
                <select id="move-category-select">
                    <option value="" data-i18n="moves.allCategories">All Categories</option>
                    <option value="physical" data-i18n="learnset.physical">Physical</option>
                    <option value="special" data-i18n="learnset.special">Special</option>
                    <option value="status" data-i18n="learnset.status">Status</option>
                </select>
            </div>

            <div id="moves-result"></div>

        </div>

    </main>

    <footer>
        <div class="footer-content max-content">
            <img src="../assets/images/pokeball.png" alt="Pokeball Image">
            <a href="imprint.html" data-i18n="footer.imprint">Imprint</a>
        </div>
    </footer>

</body>

</html>
