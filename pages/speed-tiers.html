<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | Speed Tiers</title>

    <link rel="icon" href="../assets/images/pokeball.png">

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/standard.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/inputs.css">
    <link rel="stylesheet" href="../css/components/speed-tiers.css">
    <link rel="stylesheet" href="../css/components/nav.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <script type="module" src="../js/pages/speed-tiers-page.js"></script>

</head>

<body>

    <header>
        <div class="header-content max-content">
            <div class="header-left">
                <div class="header-brand">
                    <a href="../index.html">
                        <img src="../assets/images/pokeball.png" alt="Pokeball Image">
                        <p>Pokédex</p>
                    </a>
                </div>
            </div>

            <div class="header-right">
                <div id="header-lang-slot" class="nav-desktop-only"></div>

                <div id="header-nav-slot" class="nav-desktop-only"></div>

                <button id="nav-toggle" class="svg-button nav-mobile-trigger">

                    <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 5h16" />
                        <path d="M4 12h16" />
                        <path d="M4 19h16" />
                    </svg>

                    <svg id="menu-close-icon" xmlns="http://www.w3.org/2000/svg" class="hidden" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>

                </button>
            </div>
        </div>
    </header>

    <div class="sidebar" id="sidebar"></div>

    <main>

        <div id="loader" class="loader hidden">
            <img src="../assets/images/pokeball.png" alt="Loading">
        </div>

        <div class="speed-tiers-content max-content">

            <h1 data-i18n="speedTiers.title">Speed Tiers</h1>

            <div class="speed-tiers-filters">

                <div class="search-group">
                    <label for="generation-select" data-i18n="speedTiers.generationLabel">Generation</label>
                    <select id="generation-select"></select>
                </div>

                <div class="search-group">
                    <label for="benchmark-input" data-i18n="speedTiers.benchmarkLabel">Your Speed</label>
                    <input type="number" id="benchmark-input" min="0"
                        data-i18n-placeholder="speedTiers.benchmarkPlaceholder" placeholder="Enter a speed value...">
                </div>

                <div id="benchmark-quick-picks" class="benchmark-quick-picks"></div>

                <button type="button" id="scarf-toggle" class="load-btn scarf-toggle"
                    data-i18n="speedTiers.choiceScarfToggle">Choice Scarf (×1.5)</button>

            </div>

            <ul id="speed-tier-list" class="speed-tier-list"></ul>

        </div>

    </main>

    <footer>
        <div class="footer-content max-content">
            <img src="../assets/images/pokeball.png" alt="Pokeball Image">
            <a href="imprint.html" data-i18n="footer.imprint">Imprint</a>
        </div>
    </footer>

</body>

</html>
